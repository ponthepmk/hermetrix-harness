name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '^$' || true)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      # go build ./... passes on a repository with no main package, which is
      # exactly what a loose .gitignore entry once produced: green CI, no
      # program. Build the binary by name and run it.
      - name: the program exists and runs
        run: |
          go build -o "${RUNNER_TEMP}/hermetrix" ./cmd/hermetrix
          if ! "${RUNNER_TEMP}/hermetrix" 2>&1 | grep -q "^usage:"; then
            echo "the built binary did not print its usage"
            exit 1
          fi

      # The product ships for Windows and this repository was not buildable
      # there: a process-group call guarded by runtime.GOOS still had to
      # compile, and syscall.Kill does not exist on Windows at all. A runtime
      # check cannot hide a compile-time symbol, and nothing on a Linux runner
      # would ever have noticed.
      - name: builds for every supported platform
        run: |
          for target in windows linux darwin; do
            GOOS="$target" GOARCH=amd64 go build -o /dev/null ./cmd/hermetrix
            GOOS="$target" GOARCH=amd64 go vet ./...
          done

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1

      - name: test -race
        run: go test ./... -race -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: syntax-check the control-center script
        run: node --check internal/web/ui/app.js
